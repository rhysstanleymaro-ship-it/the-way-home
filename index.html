<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1222">
<title>Our Storybook</title>
<style>
:root{
  --bg:#0b1222; --cream:#f5ead2; --amber:#f2b560;
  --stageH:48svh; --s:.7;
  --panel:rgba(7,11,22,.76); --edge:rgba(245,234,210,.15); --btn:rgba(245,234,210,.09);
}
@media (min-width:900px){ :root{--stageH:50svh} #panel,#nav{width:min(800px,100%)} }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--cream);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  transition:background-color 1.6s ease;
}
body.home{--bg:#2a1b14;--panel:rgba(40,25,17,.8);--edge:rgba(255,222,170,.22);--btn:rgba(255,222,170,.1)}
button[hidden]{display:none}

/* ---------- stage ---------- */
#stage{position:fixed;left:0;top:0;width:100%;height:var(--stageH);overflow:hidden;background:#0b1222}
.sky{position:absolute;inset:0;transition:opacity 2s ease}
.s1{background:linear-gradient(#050914,#0f1d3d 55%,#27395e)}
.s2{background:linear-gradient(#0e1530,#3a3050 55%,#a86f45);opacity:0}
#stars{position:absolute;inset:0;transition:opacity 2s ease}
#stars svg{width:100%;height:100%;display:block}
.cl{position:absolute;left:0;border-radius:50%;background:#1b2b50;opacity:.5;will-change:transform;animation:drift 120s linear infinite}
.cl.a{top:16%;width:240px;height:26px}
.cl.b{top:29%;width:300px;height:22px;animation-delay:-70s;opacity:.38}
@keyframes drift{from{transform:translateX(-320px)}to{transform:translateX(110vw)}}
#world{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;left:0;bottom:0;height:100%;will-change:transform;
  transition:transform 1.9s cubic-bezier(.45,.05,.25,1)}
.layer svg{display:block;height:100%}
#warm{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity 2s ease;
  background:radial-gradient(ellipse at 45% 95%,rgba(255,170,70,.3),rgba(255,150,60,.08) 55%,transparent 75%)}

/* couple */
#couple{position:absolute;bottom:calc(var(--s)*80px);width:calc(var(--s)*120px);height:calc(var(--s)*150px);
  transition:transform .45s ease}
#couple svg{width:100%;height:100%;display:block;overflow:visible}
.lg{transform-box:fill-box;transform-origin:top center}
/* Walking limb animation disabled: keep both characters' legs and arms still. */
/* Sleeping-page floating zzz marks */
#zzz{position:absolute;right:calc(var(--s)*42px);top:22%;z-index:9;pointer-events:none;opacity:0;color:#f4dfb2;font:700 clamp(18px,4vw,30px)/1 system-ui,sans-serif;letter-spacing:.08em;text-shadow:0 2px 12px rgba(0,0,0,.7);transition:opacity .8s ease}
#zzz span{display:inline-block;animation:zzzFloat 2.8s ease-in-out infinite}
#zzz span:nth-child(2){font-size:.78em;animation-delay:.55s}
#zzz span:nth-child(3){font-size:.58em;animation-delay:1.1s}
#stage.sleep-page #zzz{opacity:.95}
@keyframes zzzFloat{0%,100%{transform:translate(0,5px) rotate(-8deg);opacity:.45}50%{transform:translate(8px,-12px) rotate(7deg);opacity:1}}
@keyframes sw{
  0%,50%,100%{transform:rotate(0deg)}
  25%{transform:rotate(22deg)}
  75%{transform:rotate(-22deg)}}
@keyframes ar{
  0%{transform:rotate(0);animation-timing-function:cubic-bezier(.39,.575,.565,1)}
  25%{transform:rotate(10deg);animation-timing-function:cubic-bezier(.47,0,.745,.715)}
  50%{transform:rotate(0);animation-timing-function:cubic-bezier(.39,.575,.565,1)}
  75%{transform:rotate(-10deg);animation-timing-function:cubic-bezier(.47,0,.745,.715)}
  100%{transform:rotate(0)}}
@keyframes bob{
  0%,50%,100%{transform:translateY(0) rotate(0)}
  25%{transform:translateY(-1.6px) rotate(-1.2deg)}
  75%{transform:translateY(-1.6px) rotate(1.2deg)}}

/* ambient motion (only a few things move) */
.sway{animation:sway 6s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.tail{animation:tail 4s ease-in-out infinite alternate}
@keyframes tail{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
.drv{animation:drive 85s linear infinite}
.drl{animation:drivel 110s linear infinite}
@keyframes drive{from{transform:translateX(-160px)}to{transform:translateX(5900px)}}
@keyframes drivel{from{transform:translateX(5900px)}to{transform:translateX(-160px)}}
.steam{animation:steam 3.4s ease-out infinite}
@keyframes steam{0%{transform:translateY(0);opacity:0}30%{opacity:.5}100%{transform:translateY(-18px);opacity:0}}

/* interior */
#interior{position:absolute;inset:0;background:#3b2a20;opacity:0;visibility:hidden;pointer-events:none;transition:opacity 1.5s ease,visibility 0s linear 1.5s}
.inside #interior{opacity:1;visibility:visible;transition:opacity 1.5s ease,visibility 0s}
#stage:not(.inside) #interior *{animation-play-state:paused}
#interior svg{position:absolute;inset:0;width:100%;height:100%}
.st{opacity:0;transition:opacity 1.3s ease}
#interior[data-s="0"] .st0,#interior[data-s="1"] .st1,#interior[data-s="2"] .st2,#interior[data-s="3"] .st3{opacity:1}
#veil{position:absolute;inset:0;background:#070b16;opacity:0;pointer-events:none;transition:opacity .8s ease;z-index:9}
#stage.finale::after{content:"";position:absolute;inset:0;background:rgba(3,5,12,.48);pointer-events:none;z-index:8}
#stage.finale #interior .st3{filter:brightness(.78)}
#stage.finale #interior .st3 .lamp-glow{opacity:1}
#text.final-letter p{opacity:0;animation:finalFade .9s ease forwards}
#text.final-letter p:last-child{font-size:12px;text-align:center;letter-spacing:.2em;margin-top:1.8em;opacity:.7}
#text.final-letter p:nth-child(1){animation-delay:.15s}
#text.final-letter p:nth-child(2){animation-delay:.35s}
#text.final-letter p:nth-child(3){animation-delay:.55s}
#text.final-letter p:nth-child(4){animation-delay:.75s}
#text.final-letter p:nth-child(5){animation-delay:.95s}
#text.final-letter p:nth-child(6){animation-delay:1.15s}
#text.final-letter p:nth-child(7){animation-delay:1.35s}
#text.final-letter p:nth-child(8){animation-delay:1.55s}
#text.final-letter p:nth-child(9){animation-delay:1.75s}
#text.final-letter p:nth-child(10){animation-delay:1.95s}
#text.final-letter p:nth-child(11){animation-delay:2.15s}
#text.final-letter p:nth-child(12){animation-delay:2.35s}
#text.final-letter p:nth-child(13){animation-delay:2.55s}
#text.final-letter p:nth-child(14){animation-delay:2.75s}
#text.final-letter p:nth-child(15){animation-delay:2.95s}
#text.final-letter p:nth-child(16){animation-delay:3.15s}
#text.final-letter p:nth-child(17){animation-delay:3.35s}
#text.final-letter p:nth-child(18){animation-delay:3.55s}
#text.final-letter p:nth-child(19){animation-delay:3.75s}
#text.final-letter p:nth-child(20){animation-delay:3.95s}
@keyframes finalFade{to{opacity:1}}
.veil #veil{opacity:1}
.nt,.nt *{transition:none!important}

/* ---------- letter + navigation ---------- */
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:26px 14px max(14px,env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(5,8,16,.5) 30%)}
#panel{
  width:min(680px,100%);max-height:calc(100svh - var(--stageH) * .74 - 108px);overflow-y:auto;
  background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:14px 18px;
  transition:opacity .55s ease,transform .55s ease,background-color .9s ease;
  scrollbar-width:thin;overscroll-behavior:contain}
#panel.out{opacity:0;transform:translateY(10px)}
#text p{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:clamp(15px,1.6vw + 9.5px,18px);
  line-height:1.64;color:var(--cream);margin:0 0 .75em;letter-spacing:.005em}
#text p:last-child{margin-bottom:0}
@media (min-width:900px){#panel{padding:20px 30px}}
#panel.more{-webkit-mask-image:linear-gradient(#000 calc(100% - 38px),transparent);mask-image:linear-gradient(#000 calc(100% - 38px),transparent)}

#nav{width:min(680px,100%);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
#count{font-size:13px;letter-spacing:.14em;color:rgba(245,234,210,.62);font-variant-numeric:tabular-nums}
.nb{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 18px;border-radius:999px;
  background:var(--btn);border:1px solid var(--edge);color:var(--cream);font:inherit;font-size:15px;cursor:pointer;
  transition:background-color .3s,box-shadow .3s,transform .2s,opacity .3s}
.nb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nb:hover,.nb:focus-visible{background:rgba(245,214,160,.18);box-shadow:0 0 18px rgba(242,181,96,.35);outline:none}
.nb:active{transform:scale(.97)}
#prev{justify-self:start}
#next,#restart{justify-self:end;grid-column:3}
.nb:disabled{opacity:.3;pointer-events:none}

/* music */
#music{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;background:rgba(7,11,22,.5);border:1px solid var(--edge);color:var(--cream);
  cursor:pointer;z-index:20;transition:background-color .3s,box-shadow .3s}
#music svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  grid-area:1/1;transition:opacity .3s}
#music .eq{grid-area:1/1;display:flex;gap:3px;align-items:flex-end;height:16px;opacity:0;transition:opacity .3s}
#music .eq b{width:3px;height:100%;background:var(--amber);border-radius:2px;transform-origin:bottom;transform:scaleY(.3)}
#music.on{box-shadow:0 0 16px rgba(242,181,96,.4)}
#music.on svg{opacity:0}
#music.on .eq{opacity:1}
#music.on .eq b{animation:eq 1s ease-in-out infinite alternate}
#music.on .eq b:nth-child(2){animation-delay:-.4s}
#music.on .eq b:nth-child(3){animation-delay:-.75s}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  .layer,.sky,#warm,#interior,.st,#panel,#couple{transition-duration:.01s!important}
}

/* ---------- detours: scenes, chat bubbles, choices, floating bubbles ---------- */
#il{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .9s ease,visibility 0s linear .9s}
.ilm #il{opacity:1;visibility:visible;transition:opacity .9s ease,visibility 0s}
#il svg{position:absolute;inset:0;width:100%;height:100%}
.sc{opacity:0;transition:opacity .5s ease}
#il[data-sc="jeep"] .sc-jeep,#il[data-sc="store"] .sc-store,#il[data-sc="fast"] .sc-fast{opacity:1}
.at1,.at2,.at3{opacity:0;transition:opacity .6s ease}
#il.g1 .at1,#il.g2 .at2,#il.g3 .at3{opacity:1}
.on0,.on1{opacity:0;transition:opacity .6s ease}
#il[data-s="0"] .on0,#il[data-s="1"] .on1{opacity:1}
.jsway{animation:jsway 2.6s ease-in-out infinite alternate}
@keyframes jsway{from{transform:translateY(-1.5px)}to{transform:translateY(1.5px)}}
.scroll{animation:scrollx 7s linear infinite;will-change:transform}
@keyframes scrollx{to{transform:translateX(-800px)}}
#stage:not(.ilm) #il *{animation-play-state:paused}
body[data-il="jeep"]{--bg:#171b24}
body[data-il="store"]{--bg:#4c463b}
body[data-il="fast"]{--bg:#3d2318}
.fly{position:absolute;left:0;top:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .3s}
.fly.on{opacity:1}
.fly i{display:block;transform:translate(-50%,-100%);background:#f5ead2;color:#2a1c17;font:600 13px/1 system-ui,sans-serif;font-style:normal;padding:7px 11px;border-radius:14px 14px 14px 4px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.fly.hint i{animation:nudge 1.5s ease-in-out infinite}
@keyframes nudge{50%{transform:translate(-50%,-112%)}}
#text.chat{display:flex;flex-direction:column;gap:8px}
.b{max-width:84%;padding:9px 13px;border-radius:16px;font:15px/1.42 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;opacity:0;transform:translateY(8px);animation:pop .45s ease forwards}
.b small{display:block;font-size:11px;opacity:.65;margin-bottom:2px;letter-spacing:.05em}
.b.her{align-self:flex-start;background:#e9d8b6;color:#2a1c17;border-bottom-left-radius:5px}
.b.him{align-self:flex-end;background:#5d7ba8;color:#fff;border-bottom-right-radius:5px}
.b.drv,.b.crew,.b.cash{align-self:flex-start;background:rgba(255,255,255,.12);color:var(--cream);border:1px solid var(--edge);border-bottom-left-radius:5px}
.b.nar{align-self:center;max-width:92%;padding:2px 8px;background:none;color:rgba(245,234,210,.62);font-style:italic;font-size:13px;text-align:center}
@keyframes pop{to{opacity:1;transform:none}}
#choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
#choices:empty{display:none}
#choices button{min-height:46px;padding:0 16px;border-radius:999px;background:var(--btn);border:1px solid var(--edge);color:var(--cream);font:inherit;font-size:15px;cursor:pointer;animation:pop .45s ease forwards;opacity:0;transition:background-color .3s,box-shadow .3s}
#choices button:hover,#choices button:focus-visible{background:rgba(245,214,160,.2);box-shadow:0 0 16px rgba(242,181,96,.35);outline:none}
@media (prefers-reduced-motion:reduce){.b,#choices button{animation:none!important;opacity:1;transform:none}}
</style>
</head>
<body>

<!-- Scene (decorative). All artwork is generated by the script below -->
<div id="stage" aria-hidden="true">
  <div class="sky s1"></div>
  <div class="sky s2"></div>
  <div id="stars"></div>
  <canvas id="world"></canvas>
  <div id="couple"></div>
  <div id="zzz" aria-hidden="true"><span>z</span><span>z</span><span>z</span></div>
  <div id="warm"></div>
  <div id="interior"></div>
  <div id="il"></div>
  <div class="fly" id="fly1"><i></i></div><div class="fly" id="fly2"><i></i></div>
  <div id="veil"></div>
</div>

<!-- Letter + navigation -->
<main id="ui">
  <section id="panel" aria-live="polite"><div id="text"></div><div id="choices"></div></section>
  <nav id="nav" aria-label="Letter pages">
    <button id="prev" class="nb" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Previous</span>
    </button>
    <span id="count">01 / 18</span>
    <button id="next" class="nb" type="button"><span>Continue</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button id="restart" class="nb" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></svg><span>Read again</span>
    </button>
  </nav>
</main>

<!-- Music: one single audio element, never recreated -->
<button id="music" type="button" aria-label="Play music" aria-pressed="false">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2.4"/><circle cx="17" cy="16" r="2.4"/></svg>
  <i class="eq" aria-hidden="true"><b></b><b></b><b></b></i>
</button>
<audio id="bgm" src="assets/music/song.mp3" loop preload="none"></audio>

<script>
/*
  THE LETTER: your exact text, split into pages at natural paragraph breaks.
  Each page is an array of paragraphs. The last 3 pages take place inside the home.
  Edit the words here freely. Keep each paragraph inside backticks ` ` with a comma after it.
*/
window.LETTER = [
  { text: [
`you matter, even when you have nothing to offer`,
`my love,`,
`there's something i've been wanting to tell you, something i hope you'll remember even on days when things don't go as planned, when you're tired, when life feels overwhelming, or when you feel like you haven't done enough.`,
`i hope you know that you matter, even when you have nothing to offer anyone.`
  ]},
  { text: [
`you don't have to accomplish something to deserve appreciation. you don't have to constantly make someone happy, give something in return, or prove that you're worthy of being loved. you don't always have to be productive, strong, cheerful, or have everything figured out.`,
`you can have ordinary days. you can have days when you don't feel like doing anything, days when you're exhausted, or days when all you want is to rest. and that's perfectly fine.`
  ]},
  { text: [
`i want you to understand that your presence alone already means so much to me.`,
`i don't expect gifts, grand gestures, or something special every now and then. i don't need every day to be exciting or every moment to become a memorable experience. sometimes, simply being with you is enough. talking about random things, hearing you laugh, walking beside you, or even sharing silence with you.`
  ]},
  { text: [
`you might not realize it, but there are moments when i look at you and feel genuinely grateful that i get to know someone like you. especially when you laugh. i don't think i could ever get tired of seeing you happy.`,
`i wish you could occasionally see yourself through my eyes. perhaps then, you'd understand just how beautiful and precious you are to me. not only because you're my girlfriend, but because you're Audrey. someone with her own dreams, thoughts, experiences, and a life of her own. someone i genuinely admire, someone who inspires me, and someone whose happiness i sincerely wish for.`
  ]},
  { text: [
`i want to see you achieve the things you've been hoping and working for. i want to see you discover more of yourself, experience new things, and become the person you've always wanted to be. i'll always hope for good things to find their way into your life.`,
`and i hope that along the way, you never become too hard on yourself.`
  ]},
  { text: [
`there's something else i've been thinking about lately.`,
`right now, we have these little things that we sometimes take for granted. walking you home after school, having late-night walks, spending time together, and enjoying moments that don't necessarily require a special occasion.`,
`but someday, our lives might look different.`
  ]},
  { text: [
`we might have jobs to attend to, responsibilities to fulfill, and schedules that don't always agree with each other. perhaps there will be days when we're too tired to go out, evenings when we can't take those familiar walks, or moments when distance and circumstances make it difficult to spend time together.`,
`and that's okay. life moves forward, and we will have different chapters to experience.`
  ]},
  { text: [
`i'm not saying this because i'm expecting things to become worse. quite the opposite. i simply want to appreciate what we have today while looking forward to everything that life may bring.`,
`because even if we can no longer do some of the things we do now, it doesn't mean those moments become any less meaningful. and it doesn't mean that you become any less precious to me.`
  ]},
  { text: [
`i hope we continue finding little ways to spend time together, even when life becomes busier. perhaps instead of walking you home after school, i'll be waiting for you after work. perhaps instead of our late-night walks, we'll have dinner together after a long day. maybe our adventures will become quieter and our routines simpler.`,
`but i think i'd still find happiness in those ordinary moments.`,
`i don't need us to have an extraordinary life every single day. i just want us to keep growing, individually and together, while making room for each other along the way.`
  ]},
  { text: [
`and my love, i hope you know that you don't always have to be okay around me.`,
`there will be days when you're exhausted, disappointed, overwhelmed, or simply not in the mood to talk. if that happens, you don't have to force yourself to smile or pretend that everything is fine.`,
`i'd rather ask how your day went, listen when you're ready, give you a hug when you need one, and prepare something for you to eat when you haven't had the chance to rest.`,
`you don't always need advice. sometimes, you just need someone who will sit beside you and let you breathe for a while.`
  ]},
  { text: [
`even when we have misunderstandings or disagreements, i hope you never think that those moments erase how much i care about you. we won't always understand each other perfectly, and we'll have things to learn along the way. but i still want to understand you, listen to you, and be mindful of how you feel.`,
`i never want you to feel that you have to be perfect just to be loved by me.`
  ]},
  { text: [
`i want to be someone you can rely on, but i also want to be someone who encourages you to pursue your own dreams. i want to see you grow into your own person, make your own achievements, and discover the things that make you happy.`,
`you have a life beyond our relationship, and i want that life to be beautiful, too.`
  ]},
  { text: [
`so please, don't measure your worth by how much you can give, how useful you can be, or how many things you manage to accomplish.`,
`you are allowed to rest without feeling guilty. you are allowed to have difficult days without questioning your worth. you are allowed to receive love without feeling that you have to give something back immediately.`,
`you deserve to be cared for, too.`
  ]},
  { text: [
`and if someday life becomes so exhausting that you feel like you have nothing left to offer, i hope you'll remember that you don't have to bring anything extraordinary with you.`,
`you can simply come home.`
  ]},
  { text: [
`we can share a meal, talk about how our day went, or sit together without saying much. i'll be happy to have you there.`,
`because at the end of the day, i don't just want to celebrate your achievements or be beside you during your happiest moments. i want to be part of your life through its ordinary days, uncertain moments, little victories, and difficult chapters, too.`,
`i want to know the different versions of you that time will bring. the person you are today and the person you'll become years from now.`,
`and i hope that, no matter how much life changes, you'll never forget that you are someone worth loving.`
  ]},
  { text: [
`audrey, i wish you could see yourself the way i see you, even just for a moment.`,
`not someone who has to constantly give, achieve, or make everything better.`,
`just you.`,
`the girl whose laughter makes an ordinary day a little brighter. the person whose presence gives me comfort, safety, and peace. someone i admire, someone i pray for, and someone whose happiness genuinely matters to me.`,
`i love you, not because of what you can offer me, but because you're you.`,
`and i hope you never feel that you have to earn that love.`
  ]},
  { text: [
`so, my love, whatever tomorrow brings, whatever responsibilities we take on, and whatever versions of ourselves we become, please remember this:`,
`you will always be precious beyond what you can give.`,
`you deserve a place where you can rest, a person who will listen, and a love that doesn't require you to prove your worth.`,
`i hope you find that kind of peace in life.`
  ]},
  { text: [
`and i hope you know that, whenever we find ourselves at the end of a long day, i'll still be happy to sit beside you, share a meal, hold your hand, and call this little life ours.`,
`you matter, my love.`,
`even on the days when you feel you have nothing to offer.`,
`especially then.`,
`always yours.`
  ]},
  { dialogue: [
    ['her', 'good night, my love.'],
    ['him', 'good night, baby. sweet dreams. sleep well, okay?'],
    ['her', 'you too. sweet dreams, love.'],
    ['him', 'i love you, always.']
  ]},
  { text: [

/* Walking animation disabled: the couple remains in a still pose while the street scene moves. */
function startWalk() { couple.classList.remove('walk'); }
function stopWalk() { couple.classList.remove('walk'); }

function go(n) {
  if (busy || n < 0 || n >= N || n === idx) return;
  if (!IL.done && idx === IL.at && n === idx + 1) { ilStart(); return; }
  if (FLY.target === CAT0 && !CAT0.tapped) FLY.until = 0;
  busy = true;
  const back = n < idx, move = Math.min(n, K - 1) !== Math.min(idx, K - 1);
  panel.classList.add('out');
  if (move && !back) startWalk();          // forward: they walk on. Backward: the scene gently drifts back.
  cam(n); mood(n);
  setTimeout(() => { idx = n; fill(); panel.classList.remove('out'); }, reduce ? 0 : 700);
  setTimeout(() => { stopWalk(); busy = false; }, move ? TIME : 1400);
}
function restartStory() {
  if (busy) return; busy = true;
  stage.classList.add('veil'); panel.classList.add('out');
  setTimeout(() => {
    stage.classList.add('nt');

next.addEventListener('click', () => { if (IL.on) ilNext(); else go(idx + 1); });

    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(.4, t + .07); gn.gain.linearRampToValueAtTime(.28, t + d * .65); gn.gain.linearRampToValueAtTime(0, t + d);
    o.connect(bp); bp.connect(gn); gn.connect(AC.destination); o.start(t); lf.start(t); o.stop(t + d + .05); lf.stop(t + d + .05);
  } catch (e) { /* no audio available */ }
}
function meow(short) { try { mew.currentTime = 0; const p = mew.play(); if (p && p.catch) p.catch(() => synthMeow(short)); } catch (e) { synthMeow(short); } }
function fly(c, text, ms, hint) { FLY.target = c; FLY.until = performance.now() + ms; FLY.hint = !!hint; fl1.firstChild.textContent = text; dirty = true; }
const tapCat = c => { c.st = 'awake'; c.dur = 1.6; c.t0 = performance.now(); meow(); fly(c, 'meow~', 1300); dirty = true; };
CAT0.tap = c => { CAT0.tapped = true; tapCat(c); };
const pet = i => { const c = WC[i]; if (!c) return; c.st = 'happy'; c.dur = 3.2; c.t0 = performance.now(); meow(true); fly(c, 'purrr~', 2200); };
function spawnCats() { WC.length = 0; [[6.5, camZ + 7, '#c9ccd4'], [4.5, camZ + 13, '#b9773e']].forEach(([X, z, col]) => WC.push({ X, z, col, t0: -1e9, st: 'awake', dur: 1.6, tap: tapCat })); dirty = true; }
stage.addEventListener('pointerdown', e => {
  if (stage.classList.contains('inside') || stage.classList.contains('ilm')) return;
  const r = stage.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top; let best = null, bd = 1e9;
  for (const h of hits) { const d = Math.hypot(h.x - x, h.y - y); if (d < h.r && d < bd) { bd = d; best = h; } }
  if (best) best.fn();
});
const hintTimer = () => setTimeout(() => { if (idx === 0 && !CAT0.tapped && !IL.on) fly(CAT0, 'tap the cat', 1e9, true); }, 1800);

/* chat UI */
function addBubble(who, tx) {
  const b = document.createElement('div'); b.className = 'b ' + who;
  if (WHO[who]) { const s = document.createElement('small'); s.textContent = WHO[who]; b.append(s); }
  b.append(document.createTextNode(tx)); text.append(b); panel.scrollTop = panel.scrollHeight; hint();
}
function ilBubbles(s, delay) {
  text.className = 'chat'; text.textContent = ''; choicesEl.textContent = ''; next.style.visibility = 'hidden'; IL.lock = true;
  let t = delay; const gap = reduce ? 120 : 820;
  s.lines.forEach(([who, tx]) => { setTimeout(() => addBubble(who, tx), t); t += gap; });
  setTimeout(() => {
    IL.lock = false;
    if (s.choices) {
      s.choices.forEach(c => { const b = document.createElement('button'); b.type = 'button'; b.textContent = c.l;
        b.onclick = () => { if (IL.lock) return; IL.lock = true; choicesEl.textContent = ''; if (c.act) c.act(); addBubble(c.say[0], c.say[1]); setTimeout(() => ilGo(c.go), 900); };
        choicesEl.append(b); });
      panel.scrollTop = panel.scrollHeight; hint();
    } else next.style.visibility = 'visible';
  }, t - 250);
}
function ilSetScene(s) {
  const ov = s.sc !== 'street';
  stage.classList.toggle('ilm', ov); document.body.dataset.il = ov ? s.sc : '';
  if (ov) { il.dataset.sc = s.sc; il.dataset.s = s.s || 0; il.className = [...Array((s.s || 0) + 1).keys()].map(j => 'g' + j).join(' '); }
  JP.say = s.say || '';
  if (s.jeepOff) JP.on = false;
  if (s.jeep === 'arrive' || (s.jeep === 'stop' && !JP.on)) { JP.d = 3.2; JP.a = 0; jpGo(9, 1700, 'in'); }
  else if (s.jeep === 'leave') jpGo(80, 3400, 'out');
  if (s.walk != null && s.walk !== IL.off) { IL.off = s.walk; cam(IL.page); startWalk(); setTimeout(stopWalk, TIME); }
  if (s.cats) spawnCats();
  dirty = true;
}
function ilGo(id) {
  IL.lock = true; panel.classList.add('out');
  setTimeout(() => {
    const s = ST[id](); IL.cur = s;
    const changed = (s.sc !== 'street') !== stage.classList.contains('ilm') || (s.sc !== 'street' && s.sc !== IL.sc);
    IL.sc = s.sc; ilSetScene(s); panel.classList.remove('out'); ilBubbles(s, changed ? 1000 : 250);
  }, reduce ? 0 : 500);
}
function ilStart() {
  busy = true; IL.on = true; IL.page = idx; IL.sc = 'street';
  if (FLY.target === CAT0) FLY.until = 0;
  prev.style.visibility = 'hidden'; count.textContent = '· · ·';
  ilGo('ask');
}
function ilNext() {
  if (IL.lock || !IL.cur) return;
  if (IL.cur.next === 'end') ilEnd(); else ilGo(IL.cur.next);
}
function ilEnd() {
  IL.lock = true; panel.classList.add('out');
  if (JP.on) jpGo(80, 3000, 'out'); JP.say = '';
  stage.classList.remove('ilm'); document.body.dataset.il = '';
  setTimeout(() => { IL.on = false; IL.done = true; IL.off = IL.off; busy = false; IL.lock = false; go(IL.at + 1); }, reduce ? 0 : 700);
}

/* ================= music (single audio element) ================= */
const bgm = $('#bgm'), mbtn = $('#music');
function syncMusic() {
  const on = !bgm.paused;
  mbtn.classList.toggle('on', on); mbtn.setAttribute('aria-pressed', on);
  mbtn.setAttribute('aria-label', on ? 'Pause music' : 'Play music');
}
mbtn.addEventListener('click', async () => {
  if (bgm.paused) { try { await bgm.play(); } catch (err) { console.warn('Music could not start:', err); } }
  else bgm.pause();
  syncMusic();
});
bgm.addEventListener('play', syncMusic); bgm.addEventListener('pause', syncMusic);
bgm.addEventListener('error', () => { mbtn.title = 'Add assets/music/song.mp3'; });

/* ================= init ================= */
panel.addEventListener('scroll', hint, { passive: true });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 120); });
ilRoll(); hintTimer();
stage.classList.add('nt'); layout(); mood(0); fill(); void stage.offsetWidth; stage.classList.remove('nt');
requestAnimationFrame(frame);
})();
</script>
